<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Weekly Timetable</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>

<body>
  <!--
    Author: Charles Nelzy
    Date: 2025-10-24
  -->

  <header class="site-header">
    <h1>Registeration page</h1>
  </header>

  <main class="content">
    <!-- Top row split into two blocks -->
    <div class="top-grid">
      <!-- Student info (30%) -->
      <section class="student-info" aria-label="Student information">
        <h2 class="student-info-title">Information</h2>
        <p><span class="student-name">Charles-André Nelzy</span></p>
        <p><span class="student-group">NITS24K</span></p>
      </section>

      <!-- Controls (70%): add course + day marks -->
      <section class="controls" aria-label="Add course row">
        <h2 class="controls-title">Information Fillout</h2>

        <form id="addCourseForm" novalidate>
          <div class="form-row">
            <label for="Name">Full Name</label>
            <input id="Name" name="Name" type="text" required placeholder="FirstName LastName">
            <div class="error"></div>
          </div>
          
          <div class="form-row">
            <label for="Email">Email</label>
            <input id="Email" name="Email" type="email" required placeholder="xxx@yyy.zzz">
            <div class="error"></div>
          </div>

          <div class="form-row">
            <label for="PhoneNumber">Phone Number</label>
            <input id="PhoneNumber" name="PhoneNumber" type="text" required placeholder="Enter French Phone Number, no special characters">
            <div class="error"></div>
          </div>

          <div class="form-row">
            <label for="DOB">Date Of Birth</label>
            <input id="DOB" name="DOB" type="date" required placeholder="31/07/2005">
            <div class="error"></div>
          </div>

          

          <fieldset class="Terms">
            <!-- <legend>Days (yes = &#9989;, no = &#10060;)</legend>
            -->

            <label><input id="TermsCheckbox" type="checkbox" name="checkbox" value="Yes"> Check to agree with Terms</label>
          </fieldset>

          <div class="form-row">
            <button id="Submit" type="submit" class="btn">Submit</button>
            
          </div>
        </form>
      </section>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table class="table" id="timetable">
        <thead>
          <tr>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </main>

</body>

</html>
